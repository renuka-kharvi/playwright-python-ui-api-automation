# ==========================================
# pytest.ini - Pytest Configuration File
# ==========================================

[pytest]

addopts =
    
    # General Options
    
    -v
    -s
    --browser=firefox
    --headed
    --base-url=https://www.ebay.com/
    --api_base_url=https://api.coingecko.com/
  
    # Captures and Reports
    
    #--video=retain-on-failure  
    --video=on
    --screenshot=only-on-failure
    #--screenshot=on
    --tracing=retain-on-failure
    #--tracing=on
    --html=reports/myreport.html
    --alluredir=reports/allure-results 
    
    # D:\playwright\allure-2.39.0\bin\allure.bat generate .\reports\allure-results -o .\reports\allure-report --clean   D:\playwright\allure-2.39.0\bin\allure.bat serve .\reports\allure-results

    
    # Parallel Execution
    
    #-n=2
    #--numprocesses=2


    # Test Grouping Markers
    -m "api or ui"
   
    # Flaky Test Handling
    
    #--reruns 2
    #--reruns-delay 2



# Custom Markers

markers =
    
    ui:  marker for ui test
    api: mark to run api
